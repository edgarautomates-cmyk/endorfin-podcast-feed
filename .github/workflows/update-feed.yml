name: Update podcast feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --upgrade yt-dlp pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Generate feed
        run: python generator.py --output feed.json
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json feed.previous.json
          if git diff --cached --quiet; then
            echo 'No feed changes.'
          else
            git commit -m 'chore: update podcast feed'
            git push
          fi
