name: Update podcast feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run --with pytest pytest -q
      - name: Generate feed
        run: uv run --with yt-dlp python generator.py --output feed.json
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.json feed.previous.json
          if git diff --cached --quiet; then
            echo 'No feed changes.'
          else
            git commit -m 'chore: update podcast feed'
            git push
          fi
